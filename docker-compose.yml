# Despliegue de PrestaLab (D8): cuatro contenedores en la red prestalab-net y el volumen mongodata.
# prestalab-web sirve el frontend en http://localhost:3000 y reenvía /api a prestalab-app.
# Las credenciales de MongoDB y el secreto JWT se leen de .env (ver .env.example); nunca se versionan.
services:
  prestalab-web:
    build: ./frontend
    container_name: prestalab-web
    ports:
      - "3000:8080"
    depends_on:
      - prestalab-app
    restart: unless-stopped
    networks:
      - prestalab-net

  prestalab-app:
    build: .
    container_name: prestalab-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://${MONGO_USER:?Define MONGO_USER en .env}:${MONGO_PASSWORD:?Define MONGO_PASSWORD en .env}@prestalab-db:27017/prestalab?authSource=admin
      SPRING_MAIL_HOST: prestalab-mail
      SPRING_MAIL_PORT: 1025
      PRESTALAB_JWT_SECRET: ${PRESTALAB_JWT_SECRET:?Define PRESTALAB_JWT_SECRET en .env}
    depends_on:
      prestalab-db:
        condition: service_healthy
      prestalab-mail:
        condition: service_started
    restart: unless-stopped
    networks:
      - prestalab-net

  prestalab-db:
    image: mongo:7.0
    container_name: prestalab-db
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:?Define MONGO_USER en .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?Define MONGO_PASSWORD en .env}
    volumes:
      - mongodata:/data/db
    healthcheck:
      # ping no necesita autenticarse; si el servidor no responde, mongosh termina con error.
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - prestalab-net

  prestalab-mail:
    image: axllent/mailpit
    container_name: prestalab-mail
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - prestalab-net

networks:
  prestalab-net:
    driver: bridge

volumes:
  mongodata:
