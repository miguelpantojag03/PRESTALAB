# Configuración de PrestaLab (API REST).
# Los valores de conexión y el secreto JWT llegan por variables de entorno (D8), que Spring Boot enlaza solas:
#   SPRING_DATA_MONGODB_URI,
#   SPRING_MAIL_HOST, SPRING_MAIL_PORT, PRESTALAB_JWT_SECRET
# Los valores de este archivo son solo los predeterminados para desarrollo local; aquí no hay secretos.
spring:
  application:
    name: prestalab
  data:
    mongodb:
      uri: mongodb://localhost:27017/prestalab
      # Crea al arrancar los índices declarados en las entidades: ux_usuarios_correo, uk_equipos_codigo,
      # ux_prestamos_equipo_en_curso (único parcial) y los de consulta.
      auto-index-creation: true
  mail:
    host: localhost
    port: 1025
    properties:
      mail:
        smtp:
          auth: false
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      # Un cliente no puede colar campos como "rol" o "estado": cualquier propiedad desconocida es un 400.
      fail-on-unknown-properties: true
  thymeleaf:
    # Thymeleaf solo procesa las plantillas de correo; no hay vistas web.
    check-template-location: false

server:
  port: 8080
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false
    whitelabel:
      enabled: false

prestalab:
  jwt:
    secret: ${PRESTALAB_JWT_SECRET:}
    expiracion-minutos: 60
  mail:
    remitente: no-reply@prestalab.local
