# CI de PrestaLab (D7).
#  - verify: todas las pruebas JUnit (incluidas las de Testcontainers, que usan el Docker del runner)
#    y la regla de cobertura de JaCoCo.
#  - frontend: pruebas (Vitest) y compilación del frontend React.
#  - e2e-postman: levanta los cuatro contenedores de D8, comprueba el frontend y ejecuta la colección de Postman
#    con Newman.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Java 21 (Temurin) con caché de Maven
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar, probar y verificar cobertura
        run: mvn -B verify

      - name: Publicar el reporte de JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-jacoco
          path: target/site/jacoco
          if-no-files-found: warn

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Node.js con caché de npm
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      - name: Pruebas del frontend
        run: npm test

      - name: Compilar
        run: npm run build

  e2e-postman:
    needs: [verify, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Java 21 (Temurin) con caché de Maven
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Empaquetar prestalab.jar (las pruebas ya corrieron en verify)
        run: mvn -B package -DskipTests

      - name: Crear .env con un secreto JWT generado en el job
        run: |
          cp .env.example .env
          sed -i '/^PRESTALAB_JWT_SECRET=/d' .env
          echo "PRESTALAB_JWT_SECRET=$(openssl rand -base64 48)" >> .env

      - name: Levantar prestalab-web, prestalab-app, prestalab-db y prestalab-mail
        run: docker compose up -d --build

      - name: Esperar a que la API responda (máximo 120 s)
        run: |
          for i in $(seq 1 60); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/v3/api-docs)" = "200" ]; then
              echo "API lista tras $((i * 2)) s"
              exit 0
            fi
            sleep 2
          done
          echo "La API no respondió en 120 s"
          exit 1

      - name: Comprobar el frontend y su proxy hacia la API
        run: |
          set -e
          for ruta in / /catalogo /admin/equipos; do
            curl -sf -o /dev/null -w "$ruta → %{http_code} %{content_type}\n" "http://localhost:3000$ruta"
            curl -s "http://localhost:3000$ruta" | grep -q '<div id="root">'
          done
          estado=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/v1/equipos)
          echo "/api/v1/equipos sin token por el proxy → $estado"
          test "$estado" = "401"
          estado=$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' \
            -d '{"correo":"admin@prestalab.local","password":"Admin123*"}' http://localhost:3000/api/v1/auth/login)
          echo "login por el proxy → $estado"
          test "$estado" = "200"

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Newman
        run: npm install --global newman@6

      - name: Ejecutar la colección de Postman
        run: |
          mkdir -p target/newman
          newman run postman/PrestaLab-API.postman_collection.json \
            -e postman/PrestaLab-API.local.postman_environment.json \
            --reporters cli,junit --reporter-junit-export target/newman/resultado.xml

      - name: Publicar el reporte JUnit de Newman
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-newman
          path: target/newman/resultado.xml
          if-no-files-found: warn

      - name: Mostrar los logs de los contenedores si algo falló
        if: failure()
        run: docker compose logs

      - name: Apagar y borrar los contenedores y el volumen
        if: always()
        run: docker compose down -v
