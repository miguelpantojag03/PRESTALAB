# prestalab-web: sirve el frontend y reenvía la API a prestalab-app.
# El navegador ve un solo origen (http://localhost:3000), así que el backend no necesita CORS.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location /api/ {
        proxy_pass http://prestalab-app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger UI y el contrato OpenAPI, también desde el mismo origen.
    location ~ ^/(v3/api-docs|swagger-ui) {
        proxy_pass http://prestalab-app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Los archivos de Vite llevan un hash en el nombre: se pueden guardar en caché sin límite.
    location /assets/ {
        # add_header aquí anula los del bloque server, así que se repiten.
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri =404;
    }

    # Rutas de la SPA (/catalogo, /admin/equipos, etc.): siempre index.html, sin caché.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri /index.html;
    }
}
